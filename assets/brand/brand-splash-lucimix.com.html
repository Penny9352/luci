.wrap{background:#000;min-height:600px;min-height:100dvh;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:40px 24px 28px;position:relative;overflow:hidden;font-family:'QingNiao','Noto Serif SC',serif}
canvas#ripple{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.top-logo{font-size:11px;letter-spacing:.35em;color:#888;font-family:'Noto Sans SC',sans-serif;font-weight:300;align-self:flex-start;z-index:2;position:relative}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2;position:relative}
.row{display:flex;align-items:center;justify-content:center}
#row1{margin-bottom:14px}
.ch{display:inline-block;position:relative;width:1em;margin:0 10px;font-size:clamp(43px,6.6vw,70px);line-height:1.3;font-weight:400;color:#fff;text-align:center;vertical-align:middle}
.ch.intro{opacity:0;transition:opacity .8s ease,width 1s ease,margin 1s ease}
.ch.intro.visible{opacity:1}
.ch.intro.collapsed{opacity:0;width:0;margin:0}
.ch.new{width:0;margin:0;opacity:0;color:#fff;transform:translateY(8px);transition:width 1s ease,margin 1s ease,opacity .8s ease,transform .8s ease}
.ch.new.reserve{width:1em;margin:0 10px}
.ch.new.shown{opacity:1;transform:translateY(0)}
.composite .ghost{opacity:0;display:block}
.composite .layer{position:absolute;top:0;left:0;width:100%;display:block;line-height:1.3;text-align:center;transition:opacity 1s ease}
.layer.radical{
  -webkit-mask-image:linear-gradient(to right, #000 26%, transparent 44%);
  mask-image:linear-gradient(to right, #000 26%, transparent 44%);
  color:#fff;
}
.layer.radical.faded{opacity:0}
.layer.body{
  -webkit-mask-image:linear-gradient(to right, transparent 26%, #000 44%);
  mask-image:linear-gradient(to right, transparent 26%, #000 44%);
  color:#d4b87a;
}
.layer.body.faded{opacity:0}
.layer.final{color:#d4b87a;opacity:0}
.layer.final.shown{opacity:1}
.footer{text-align:center;color:#666;font-size:12px;font-family:'Noto Sans SC',sans-serif;font-weight:300;letter-spacing:.07em;line-height:2;z-index:2;position:relative}
.footer a{color:#666;text-decoration:none}
</style>

<div class="wrap" id="wrap">
  <canvas id="ripple"></canvas>
  <div class="top-logo">光忽智能</div>

  <div class="stage">
    <div class="row" id="row1">
      <span class="ch intro" id="ch-dao">道</span>
      <span class="ch intro" id="ch-zhi">之</span>
      <span class="ch intro" id="ch-wei">为</span>
      <span class="ch intro" id="ch-wu">物</span>
    </div>
    <div class="row" id="row2">
      <span class="ch intro" id="ch-wei2">惟</span>
      <span class="ch intro composite" id="ch-huang">
        <span class="ghost">恍</span>
        <span class="layer radical" id="huang-rad">恍</span>
        <span class="layer body" id="huang-body">恍</span>
        <span class="layer final" id="huang-final">光</span>
      </span>
      <span class="ch intro" id="ch-wei3">惟</span>
      <span class="ch intro composite" id="ch-hu">
        <span class="ghost">惚</span>
        <span class="layer radical" id="hu-rad">惚</span>
        <span class="layer body" id="hu-body">惚</span>
        <span class="layer final" id="hu-final">忽</span>
      </span>
      <span class="ch new" id="ch-zhi-new">智</span>
      <span class="ch new" id="ch-neng-new">能</span>
    </div>
  </div>

  <div class="footer">
    <div><a href="#">京ICP备2025000000号</a></div>
    <div>北京光忽智能科技有限公司</div>
  </div>
</div>

<script>
const canvas=document.getElementById('ripple');
const wrap=document.getElementById('wrap');
const ctx=canvas.getContext('2d');

const stars=[];
function initStars(){
  stars.length=0;
  const count=Math.max(20,Math.min(90,Math.round(canvas.width*canvas.height/22000)));
  for(let i=0;i<count;i++){
    const big=Math.random()<0.28, sp=big?0.6:1;  // big=焦外大光斑（虚化、淡、移动更慢=景深视差）
    stars.push({
      x:Math.random()*canvas.width,
      y:Math.random()*canvas.height,
      r:big?2.2+Math.random()*2.6:0.3+Math.random()*1.0,
      vx:(Math.random()-0.5)*0.234*sp,
      vy:(Math.random()-0.5)*0.234*sp,
      base:big?0.05+Math.random()*0.16:0.12+Math.random()*0.6,
      phase:Math.random()*Math.PI*2,
      tw:big?0.002+Math.random()*0.006:0.004+Math.random()*0.014,
      gold:Math.random()<0.16,
      sharp:!big&&Math.random()<0.45             // 约 45% 小亮点用清晰实心核（虚实对比）
    });
  }
  // 极少量巨大光斑：最远景深底层——超大、极淡、移动极慢，增强纵深层次
  const megaCount=2+Math.round(Math.random());  // 2~3 个
  for(let i=0;i<megaCount;i++){
    stars.push({
      x:Math.random()*canvas.width,
      y:Math.random()*canvas.height,
      r:16+Math.random()*12,                     // size≈407~707px 的大光团（x2）
      vx:(Math.random()-0.5)*0.234*0.35,         // 视差最远=移动最慢
      vy:(Math.random()-0.5)*0.234*0.35,
      base:0.06+Math.random()*0.1,               // 巨大光斑亮度 x2
      phase:Math.random()*Math.PI*2,
      tw:0.001+Math.random()*0.002,              // 呼吸般极缓明灭
      gold:Math.random()<0.3                     // 稍多金色，暖调氛围
    });
  }
}
function makeGlow(r,g,b,sharp){
  const S=64,c=document.createElement('canvas');c.width=c.height=S;
  const gx=c.getContext('2d');
  const grad=gx.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
  const stops=sharp
    ?[[0,1],[0.34,0.96],[0.44,0.5],[0.56,0.12],[0.72,0.02],[1,0]]                                       // 实心亮核 + 明确边缘
    :[[0,0.95],[0.08,0.78],[0.16,0.55],[0.26,0.36],[0.38,0.21],[0.52,0.11],[0.7,0.04],[0.85,0.012],[1,0]]; // 高斯柔雾
  for(const [p,a] of stops) grad.addColorStop(p,`rgba(${r},${g},${b},${a})`);
  gx.fillStyle=grad;gx.fillRect(0,0,S,S);
  return c;
}
const glowWhite=makeGlow(255,255,255,false);
const glowGold=makeGlow(212,184,122,false);
const sharpWhite=makeGlow(255,255,255,true);
const sharpGold=makeGlow(212,184,122,true);
function drawStars(){
  ctx.globalCompositeOperation='lighter';
  for(const s of stars){
    s.x+=s.vx*speedFactor; s.y+=s.vy*speedFactor; s.phase+=s.tw;
    if(s.ix){ s.x+=s.ix; s.y+=s.iy; s.ix*=0.9; s.iy*=0.9; if(s.ix*s.ix+s.iy*s.iy<0.01){s.ix=0;s.iy=0;} } // 点击吸引冲量
    if(s.x<0)s.x+=canvas.width; else if(s.x>canvas.width)s.x-=canvas.width;
    if(s.y<0)s.y+=canvas.height; else if(s.y>canvas.height)s.y-=canvas.height;
    if(s.ox===undefined){s.ox=0;s.oy=0;}
    if(mouseActive){                                  // 鼠标吸引场
      const px=s.x+s.ox, py=s.y+s.oy;
      const dx=px-mx, dy=py-my, dist=Math.hypot(dx,dy)||0.001;
      if(dist<FORCE_R){
        const f=Math.min((1-dist/FORCE_R)*FORCE_STRENGTH/(1+s.r*0.25), dist*0.3); // 近强远弱；大光斑更迟钝；钳制单帧位移≤剩余距离30%，防止贴近指针后来回过冲抖动
        s.ox-=dx/dist*f; s.oy-=dy/dist*f;             // 朝光标 = 吸引
      }
    }
    s.ox*=0.86; s.oy*=0.86;                           // 离开后弹性归位
    const a=s.base*(0.35+0.65*(0.5+0.5*Math.sin(s.phase)));
    const size=(s.sharp?4+s.r*7:7+s.r*25)*(0.55+0.45*ambient); // 清晰点更小更紧凑；由远(略小)及近
    ctx.globalAlpha=a*ambient;                   // 落位前不显，落位后淡入
    const sprite=s.sharp?(s.gold?sharpGold:sharpWhite):(s.gold?glowGold:glowWhite);
    ctx.drawImage(sprite,s.x+s.ox-size/2,s.y+s.oy-size/2,size,size);
  }
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';
}

// 大面积柔光：几团超大、极淡、缓慢游移呼吸的暖金光雾，铺底制造光影氛围
const blobs=[];
function initBlobs(){
  blobs.length=0;
  const palette=[[212,184,122],[212,184,122],[230,215,185],[200,190,160]];
  const big=Math.min(canvas.width,canvas.height);
  for(let i=0;i<4;i++){
    blobs.push({
      x:Math.random()*canvas.width,
      y:Math.random()*canvas.height,
      r:big*(0.5+Math.random()*0.45),         // 超大半径
      col:palette[i],
      vx:(Math.random()-0.5)*0.07,             // 极慢游移
      vy:(Math.random()-0.5)*0.07,
      phase:Math.random()*Math.PI*2,
      tw:0.0012+Math.random()*0.0018,          // 极缓呼吸
      base:0.05+Math.random()*0.05             // 极淡
    });
  }
}
function drawBlobs(){
  ctx.globalCompositeOperation='lighter';
  for(const b of blobs){
    b.x+=b.vx; b.y+=b.vy; b.phase+=b.tw;
    if(b.x<-b.r)b.x+=canvas.width+b.r*2; else if(b.x>canvas.width+b.r)b.x-=canvas.width+b.r*2;
    if(b.y<-b.r)b.y+=canvas.height+b.r*2; else if(b.y>canvas.height+b.r)b.y-=canvas.height+b.r*2;
    const a=b.base*(0.55+0.45*Math.sin(b.phase))*ambient; // 落位后才淡入
    const [r,g,bl]=b.col;
    const grad=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r);
    grad.addColorStop(0,`rgba(${r},${g},${bl},${a})`);
    grad.addColorStop(0.5,`rgba(${r},${g},${bl},${a*0.32})`);
    grad.addColorStop(1,`rgba(${r},${g},${bl},0)`);
    ctx.fillStyle=grad;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';
}

function resize(){canvas.width=wrap.offsetWidth;canvas.height=wrap.offsetHeight;initStars();initBlobs()}
resize();window.addEventListener('resize',resize);

let speedFactor=1.2, lastMX=null, lastMY=null, lastMT=0;
let mx=0, my=0, mouseActive=false;          // 鼠标实时坐标(canvas系) + 是否在区域内
const FORCE_R=140, FORCE_STRENGTH=12;        // 斥力作用半径 / 强度
const PULL_R=500, PULL=28;                    // 点击吸引：作用半径 / 强度（注入高速冲量）
wrap.addEventListener('mousemove',e=>{
  const now=performance.now();
  const rect=wrap.getBoundingClientRect();
  mx=e.clientX-rect.left; my=e.clientY-rect.top; mouseActive=true;
  if(lastMX!==null){
    const dt=Math.max(1,now-lastMT);
    const v=Math.hypot(e.clientX-lastMX,e.clientY-lastMY)/dt; // px/ms
    const target=1.2+Math.min(35,v*12.5);      // 鼠标越快，倍率越高（加速效果 x5，封顶 ~36 倍）
    if(target>speedFactor)speedFactor=target;
  }
  lastMX=e.clientX; lastMY=e.clientY; lastMT=now;
});
wrap.addEventListener('mouseleave',()=>{ mouseActive=false; });

// 点击「光华迸发」：从点击点喷射一簇清晰光粒子，向外飞散、阻尼减速后淡灭
const bursts=[];
function spawnBurst(x,y){
  const n=20+Math.floor(Math.random()*12);
  for(let i=0;i<n;i++){
    const ang=Math.random()*Math.PI*2, spd=1+Math.random()*3;
    bursts.push({x,y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,r:0.5+Math.random()*1.2,life:1,decay:0.012+Math.random()*0.02,gold:Math.random()<0.55});
  }
}
function drawBursts(){
  if(!bursts.length)return;
  ctx.globalCompositeOperation='lighter';
  for(let i=bursts.length-1;i>=0;i--){
    const p=bursts[i];
    p.x+=p.vx; p.y+=p.vy; p.vx*=0.94; p.vy*=0.94; p.life-=p.decay;
    if(p.life<=0){bursts.splice(i,1);continue;}
    const size=(4+p.r*7)*(0.55+p.life*0.7);        // 随生命略缩
    ctx.globalAlpha=p.life*0.9;
    ctx.drawImage(p.gold?sharpGold:sharpWhite,p.x-size/2,p.y-size/2,size,size); // 清晰锐利的火花
  }
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';
}
wrap.addEventListener('click',e=>{           // 点击：剧烈吸引 500px 内粒子，注入高速冲量涌向点击点
  const rect=wrap.getBoundingClientRect();
  const cx=e.clientX-rect.left, cy=e.clientY-rect.top;
  for(const s of stars){
    const dx=cx-s.x, dy=cy-s.y, dist=Math.hypot(dx,dy)||0.001;
    if(dist<PULL_R){
      const power=PULL*(0.35+0.65*(1-dist/PULL_R))/(1+s.r*0.2); // 近强远弱；大光斑更迟钝
      s.ix=(s.ix||0)+dx/dist*power;
      s.iy=(s.iy||0)+dy/dist*power;
    }
  }
});

let ambient=0;
let AMB_T0=performance.now(); const AMB_START=5800, AMB_DUR=1800; // 「光忽智能」落位前后氛围粒子淡入；AMB_T0 可重置以重放
function render(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  speedFactor+=(1.2-speedFactor)*0.05;         // 平滑回落到常速（x1.2）
  let p=(performance.now()-AMB_T0-AMB_START)/AMB_DUR; p=p<0?0:p>1?1:p;
  ambient=p*p*(3-2*p);                          // smoothstep 缓动
  drawBlobs();
  drawStars();
  drawBursts();
  requestAnimationFrame(render);
}
render();

const introIds=['ch-dao','ch-zhi','ch-wei','ch-wu','ch-wei2','ch-huang','ch-wei3','ch-hu'];
const introDelays=[200,500,800,1100,1700,2000,2300,2600];
const T=2600;

let introTimers=[];
function later(fn,ms){ introTimers.push(setTimeout(fn,ms)); }
function resetStage(){
  introIds.forEach(id=>document.getElementById(id).classList.remove('visible','collapsed'));
  document.getElementById('row1').style.cssText='';   // 清除 FLIP 留下的定位与 transform
  document.getElementById('row2').style.cssText='';
  ['huang-rad','huang-body','hu-rad','hu-body'].forEach(id=>document.getElementById(id).classList.remove('faded'));
  ['huang-final','hu-final'].forEach(id=>document.getElementById(id).classList.remove('shown'));
  ['ch-zhi-new','ch-neng-new'].forEach(id=>document.getElementById(id).classList.remove('reserve','shown'));
}
function playIntro(){
  introTimers.forEach(clearTimeout); introTimers=[];
  resetStage();
  AMB_T0=performance.now(); ambient=0;                 // 氛围粒子同步重新淡入

  introIds.forEach((id,i)=>later(()=>document.getElementById(id).classList.add('visible'),introDelays[i]));

  later(()=>{
    ['ch-dao','ch-zhi','ch-wei','ch-wu'].forEach((id,i)=>later(()=>document.getElementById(id).classList.remove('visible'),i*80));
  },T+1000);

  later(()=>{                                  // FLIP：用 transform 合成器动画整体上滑，替代 max-height 布局动画（逐帧重排 + 像素对齐会抖）
    const stage=document.querySelector('.stage');
    const r1=document.getElementById('row1'), r2=document.getElementById('row2');
    const stTop=stage.getBoundingClientRect().top;
    const top1=r1.getBoundingClientRect().top, top2=r2.getBoundingClientRect().top;
    r1.style.position='absolute'; r1.style.left='0'; r1.style.right='0';
    r1.style.top=(top1-stTop)+'px';            // 行1 脱离文档流钉在原地，行2 的布局位置立即上移
    const d=top2-r2.getBoundingClientRect().top; // 行2 被布局挪走的距离
    r2.style.transform='translateY('+d+'px)';  // 先钉回原位
    r2.offsetHeight;                           // 强制 reflow，让起点生效
    const ease='transform 1.2s cubic-bezier(.37,0,.63,1)';
    r2.style.transition=ease; r1.style.transition=ease;
    r2.style.transform='';                     // 平滑滑到新位置
    r1.style.transform='translateY('+(-d)+'px)'; // 行1 跟随整体一起上移（同时逐字淡出）
  },T+1000);

  later(()=>{
    document.getElementById('huang-rad').classList.add('faded');
    document.getElementById('huang-body').classList.add('faded');
    document.getElementById('huang-final').classList.add('shown');
    document.getElementById('hu-rad').classList.add('faded');
    document.getElementById('hu-body').classList.add('faded');
    document.getElementById('hu-final').classList.add('shown');
  },T+3000);

  later(()=>{
    document.getElementById('ch-wei2').classList.remove('visible');
    document.getElementById('ch-wei2').classList.add('collapsed');
    document.getElementById('ch-wei3').classList.remove('visible');
    document.getElementById('ch-wei3').classList.add('collapsed');
    document.getElementById('ch-zhi-new').classList.add('reserve');
    document.getElementById('ch-neng-new').classList.add('reserve');
  },T+3000);

  later(()=>document.getElementById('ch-zhi-new').classList.add('shown'),T+3800);
  later(()=>document.getElementById('ch-neng-new').classList.add('shown'),T+4100);
}
playIntro();
</script>
</body>
</html>
