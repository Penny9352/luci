      STORY: 访客多半已经在用免费的豆包或 Kimi。他先看到这是个完整工作台，再
      看到单模型结构上做不到的事——三个模型背靠背，分歧被标出来——然后看到它
      会自己按时来微信找他，最后注册。

      FIRST VIEWPORT: 顶栏；中央中文衬线大标题「Lucimix / 一个真正替你工作的 AI 助手」，
